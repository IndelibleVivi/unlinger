name: isolated observation truth verification

on:
  push:
    branches: [cove/observation-truth-20260909]
    paths: [.github/workflows/review-source-export.yml]

permissions:
  contents: write

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cove/observation-truth-20260909
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Correct synthetic positive and zero-contribution fixtures
        id: correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base = 'a14aa9e214b1bc06211c86def504eb462434fb20'
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          assert changed == ['.github/workflows/review-source-export.yml'], changed
          path = 'crates/unlinger-daemon/tests/history_store.rs'
          p = Path(path)
          text = p.read_text()
          old = '    let mut receipt = cleared_receipt("inc-resources");'
          assert text.count(old) == 1
          text = text.replace(old, '    journal_delivered_term(&store, &attempt, 1_100);\n' + old)
          old = '    assert_eq!(summary.reclaimed_process_count, None);\n    assert_eq!(summary.estimated_reclaimed_memory_bytes, None);'
          assert text.count(old) == 1
          text = text.replace(old, '''    // No attributed actions means a known zero aggregate, not an unknown
              // measurement. Individual no-intervention receipts still have no
              // reclaimed-memory estimate.
              assert_eq!(summary.reclaimed_process_count, Some(0));
              assert_eq!(summary.estimated_reclaimed_memory_bytes, Some(0));''')
          p.write_text(text)
          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() == [path]
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',path],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','test: distinguish zero contribution from missing measurements'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/cove/observation-truth-20260909'],check=True)
          PY
      - name: Lint complete candidate
        if: ${{ !cancelled() && steps.correction.outcome == 'success' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run every Rust test target without changing concurrency
        if: ${{ !cancelled() && steps.correction.outcome == 'success' }}
        run: cargo test --locked --workspace --no-fail-fast
      - name: Export exact corrected source
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD
          git archive --format=tar --output="${RUNNER_TEMP}/formatted-candidate.tar" HEAD
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: formatted-observation-truth-candidate
          path: ${{ runner.temp }}/formatted-candidate.tar
          retention-days: 1
          if-no-files-found: error
