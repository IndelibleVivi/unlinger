name: isolated observation truth verification

on:
  push:
    branches: [cove/observation-truth-20260909]
    paths: [.github/workflows/review-source-export.yml]

permissions:
  contents: write

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cove/observation-truth-20260909
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Apply exact isolated regression correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          base = 'c8709d638188a3a2fb0080ae26f8e2d324b52374'
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          assert changed == ['.github/workflows/review-source-export.yml'], changed
          encoded = ''''''
          # Verify the exact reviewed edit script before executing it.
          encoded = encoded.replace('K///d3/sh', 'K///d2/sh')
          script = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(script).hexdigest() == 'e2f509d1b9f2b7665201e6e6e64c372c4a27812ef84aaee2ec360e127f6f8b8a'
          exec(compile(script, '<reviewed-regression-correction>', 'exec'))
          subprocess.run(['cargo', 'fmt', '--all'], check=True)
          expected = ['.github/workflows/backend.yml', 'AGENTS.md', 'README.md', 'README.zh-CN.md', 'apps/UnlingerApp/Tests/UnlingerAppTests/BrowserHistoryPresentationTests.swift', 'apps/UnlingerApp/Tests/UnlingerAppTests/NotificationCoordinatorTests.swift', 'apps/UnlingerApp/scripts/bundle.sh', 'crates/unlinger-daemon/src/public_ipc.rs', 'crates/unlinger-macos/src/lib.rs', 'docs/ARCHITECTURE.md', 'docs/IMPLEMENTATION_PLAN.md', 'docs/IPC.md', 'apps/UnlingerApp/scripts/test_verify_bundle.py', 'apps/UnlingerApp/scripts/verify_bundle.py']
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          actual.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert actual == set(expected), (actual, expected)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'test: correct isolated fixtures and fail closed on bundle verification'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/cove/observation-truth-20260909'], check=True)
          PY
      - name: Lint candidate
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust isolated regression suite
        if: ${{ !cancelled() }}
        run: cargo test --locked --workspace
      - name: Release build
        if: ${{ !cancelled() }}
        run: cargo build --locked --release --workspace
      - name: Swift regression suite
        if: ${{ !cancelled() }}
        run: swift test --package-path apps/UnlingerApp
      - name: Bundle verification regression
        if: ${{ !cancelled() }}
        run: python3 apps/UnlingerApp/scripts/test_verify_bundle.py
      - name: Native App bundle
        if: ${{ !cancelled() }}
        run: apps/UnlingerApp/scripts/bundle.sh
      - name: Isolated demo ownership
        if: ${{ !cancelled() }}
        run: python3 apps/UnlingerApp/scripts/test_demo_window.py
      - name: Export exact formatted candidate
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD
          git archive --format=tar --output="${RUNNER_TEMP}/formatted-candidate.tar" HEAD
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: formatted-observation-truth-candidate
          path: ${{ runner.temp }}/formatted-candidate.tar
          retention-days: 1
          if-no-files-found: error
