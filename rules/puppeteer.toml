schema_version = 2
id = "puppeteer"
version = "0.4.0"
supported_versions = "Chrome for Testing 151.0.7922.34 and 152.0.7977.42 only; Puppeteer controller version remains observational"
graceful_strategy = "os_term_only"
controller_markers = ["puppeteer", "@puppeteer/browsers"]
framework_markers = ["puppeteer", "@puppeteer/browsers", "chrome-headless-shell"]
ephemeral_profile_markers = ["puppeteer_dev_chrome_profile", "puppeteer"]
browser_executable_markers = ["chrome-headless-shell", "chrome for testing", "chromium", "google chrome"]
recorder_executable_basenames = ["ffmpeg"]

[version_policy]
mode = "exact_allowlist"
bundle_id = "com.google.chrome.for.testing"
versions = ["151.0.7922.34", "152.0.7977.42"]

[artifact_policy]
devtools_active_port = false
