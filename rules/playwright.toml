schema_version = 2
id = "playwright"
version = "0.5.0"
supported_versions = "Chrome for Testing 151.0.7922.34 and 152.0.7977.42 only; task-owned Playwright CLI 1.63.0-alpha-2026-08-31; other controllers remain observational"
task_controller_version = "1.63.0-alpha-2026-08-31"
graceful_strategy = "os_term_only"
controller_markers = ["playwright", "@playwright/mcp", "playwright-mcp"]
framework_markers = ["playwright", "@playwright/mcp", "ms-playwright"]
ephemeral_profile_markers = ["playwright_chromiumdev_profile", "playwright-artifacts", "ms-playwright"]
browser_executable_markers = ["chrome for testing", "chromium", "google chrome"]
recorder_executable_basenames = ["ffmpeg"]

[version_policy]
mode = "exact_allowlist"
bundle_id = "com.google.chrome.for.testing"
versions = ["151.0.7922.34", "152.0.7977.42"]

[artifact_policy]
devtools_active_port = false
